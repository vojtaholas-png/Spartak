<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tabule – Spartak VOTOČEK</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@font-face{font-family:'LedFont';src:local('Bebas Neue'),local('BebasNeue-Regular'),local('Impact'),local('DejaVu Sans Condensed Bold'),local('DejaVuSansCondensed-Bold'),local('Arial Narrow Bold'),local('ArialNarrow-Bold');}
:root{
  --S:#2fe07a; --M:#33b5f4; --bg:#05090d; --line:rgba(255,255,255,.14);
  --display:'Bebas Neue','LedFont',sans-serif;
  --text:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body.idle{cursor:none}

/* Celá plocha se přizpůsobí obrazovce (5:3 i 16:9) – všechno je v jednotkách výšky */
#board{position:fixed;inset:0;display:grid;grid-template-rows:7vh 45vh 24vh 24vh;
  background:var(--bg);color:#fff;font-family:var(--text);overflow:hidden}
#board::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 70% at 50% 40%,rgba(255,255,255,.04),transparent 70%)}

/* horní lišta */
#top{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:5.4vh;letter-spacing:.42em;
  color:rgba(255,255,255,.78);padding-left:.42em}

/* hlavní skóre */
#live{display:grid;grid-template-columns:1fr 1fr;position:relative;border-top:.3vh solid var(--line)}
#live::after{content:"";position:absolute;left:50%;top:5%;bottom:5%;width:0;border-left:.35vh dashed rgba(255,255,255,.22)}
.half{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vh;min-width:0;
  background:linear-gradient(to bottom,transparent,var(--tint,transparent))}
.half .logo{height:11vh;width:auto;max-width:90%;object-fit:contain}
.half .tn{font-family:var(--display);font-size:4.2vh;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  color:var(--c,#fff);max-width:96%;overflow:hidden;text-overflow:clip}
.half .sc{font-family:var(--display);font-size:23vh;line-height:.8;font-variant-numeric:tabular-nums;padding-top:1vh}
.half .tob{font-family:var(--display);font-size:2.8vh;letter-spacing:.1em;color:var(--c);border:.3vh solid var(--c);border-radius:1vh;padding:.1vh 1.6vh;margin-top:.2vh;white-space:nowrap}
.half .tob.used{color:#8a949c;border-color:#444e56;text-decoration:line-through;opacity:.8}
.half .sc.win{color:var(--c)}
.half .sc.lose{opacity:.5}

/* výsledky setů */
#sets{display:grid;grid-template-rows:repeat(3,1fr);border-top:.3vh solid var(--line);padding:.6vh 0}
.srow{position:relative;display:grid;grid-template-columns:1fr 7vh 1fr;align-items:center;opacity:.5}
.srow.done,.srow.cur{opacity:1}
.srow.cur{background:linear-gradient(90deg,transparent,rgba(255,255,255,.07) 30%,rgba(255,255,255,.07) 70%,transparent)}
.srow .lbl{position:absolute;left:3.5vw;font-family:var(--display);font-size:4.8vh;letter-spacing:.14em;color:rgba(255,255,255,.7)}
.srow .l,.srow .r{display:flex;align-items:center;gap:2vh}
.srow .l{justify-content:flex-end}
.srow .r{justify-content:flex-start}
.srow img{height:6.3vh;width:auto;object-fit:contain}
.srow .n{font-family:var(--display);font-size:7.6vh;line-height:1;min-width:6.5vh;text-align:center;font-variant-numeric:tabular-nums}
.srow .x{font-family:var(--display);font-size:6vh;text-align:center;color:rgba(255,255,255,.6)}
.srow .n.lose{opacity:.5}
.srow .n.win{color:var(--wc,#fff)}

/* celkové skóre zápasu */
#match{display:flex;flex-direction:column;border-top:.3vh solid var(--line);
  background:linear-gradient(to top,rgba(255,255,255,.05),transparent)}
#match .mh{height:6.4vh;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:4.8vh;
  letter-spacing:.2em;color:rgba(255,255,255,.8);padding-top:1vh;text-transform:uppercase;white-space:nowrap}
#match .mrow{flex:1;display:grid;grid-template-columns:1fr 9vh 1fr;align-items:center;min-height:0}
#match .l,#match .r{display:flex;align-items:center;gap:3vh}
#match .l{justify-content:flex-end}
#match .r{justify-content:flex-start}
#match img{height:12.5vh;width:auto;object-fit:contain}
#match .n{font-family:var(--display);font-size:17vh;line-height:.85;min-width:10vh;text-align:center;font-variant-numeric:tabular-nums;padding-top:1.2vh}
#match .x{font-family:var(--display);font-size:11vh;text-align:center;color:rgba(255,255,255,.6);line-height:1;padding-bottom:1.2vh}

/* TIME-OUT – překryje horní (velké) skóre, výsledky setů dole zůstanou vidět */
#to{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
  background:radial-gradient(ellipse 70% 90% at 50% 50%,var(--tint,rgba(255,255,255,.1)),transparent 75%),var(--bg)}
#to.on{display:flex}
#to .tt{font-family:var(--display);font-size:6.4vh;letter-spacing:.4em;padding-left:.4em;color:rgba(255,255,255,.85)}
#to .trow{display:flex;align-items:center;gap:6vh}
#to .trow img{height:14vh;width:auto;object-fit:contain}
#to .num{font-family:var(--display);font-size:25vh;line-height:.8;min-width:30vh;text-align:center;font-variant-numeric:tabular-nums;padding-top:1.2vh}
#to.warn .num{color:#ff6b5a}
#to .tn2{font-family:var(--display);font-size:4.4vh;letter-spacing:.07em;text-transform:uppercase;color:var(--c,#fff);white-space:nowrap}
#to .bar{width:70vh;height:1.3vh;background:rgba(255,255,255,.14);border-radius:1vh;overflow:hidden;margin-top:.6vh}
#to .bar i{display:block;height:100%;width:100%;background:var(--c,#fff);transition:width .25s linear}
#to.warn .bar i{background:#ff6b5a}

/* stav připojení – zobrazí se jen při problému */
#net{position:fixed;right:1.6vh;top:1.6vh;width:2.2vh;height:2.2vh;border-radius:50%;background:#e8192c;display:none;z-index:5}
#net.on{display:block}
</style>
</head>

function defaultState(){
  return {v:1, cur:0, sides:['S','M','S'],
          sets:[{s:0,m:0},{s:0,m:0},{s:0,m:0}], match:{s:0,m:0}, timeout:null, tou:[{S:0,M:0},{S:0,M:0},{S:0,M:0}], t:0};
}
function sane(x){
  var d=defaultState();
  if(!x||typeof x!=='object') return d;
  try{
    var o={v:1,cur:Math.min(2,Math.max(0,parseInt(x.cur)||0)),sides:[],sets:[],match:{s:0,m:0},t:Number(x.t)||0};
    for(var i=0;i<3;i++){
      o.sides.push((x.sides&&x.sides[i]==='M')?'M':(x.sides&&x.sides[i]==='S'?'S':d.sides[i]));
      var st=(x.sets&&x.sets[i])||{};
      o.sets.push({s:Math.max(0,parseInt(st.s)||0), m:Math.max(0,parseInt(st.m)||0)});
    }
    o.match={s:Math.max(0,parseInt(x.match&&x.match.s)||0), m:Math.max(0,parseInt(x.match&&x.match.m)||0)};
    var to=x.timeout;
    o.timeout=(to&&(to.team==='S'||to.team==='M')&&Number(to.id))?{team:to.team,id:Number(to.id)}:null;
    o.tou=[];for(var j=0;j<3;j++){var u=(x.tou&&x.tou[j])||{};o.tou.push({S:u.S?1:0,M:u.M?1:0});}
    return o;
  }catch(e){ return d; }
}

var Store=(function(){
  var LOCAL=/[?&]local\b/.test(location.search);
  var listeners=[], ref=null, bc=null, ready=false;
  var CACHE='tabule_state_cache';
  function emit(state,meta){ listeners.forEach(function(f){ try{f(state,meta||{});}catch(e){console.error(e);} }); }
  function cached(){ try{ return sane(JSON.parse(localStorage.getItem(CACHE))); }catch(e){ return null; } }
  function cache(s){ try{ localStorage.setItem(CACHE,JSON.stringify(s)); }catch(e){} }

  function startLocal(){
    ready=true;
    try{ bc=new BroadcastChannel('tabule'); bc.onmessage=function(e){ cache(e.data); emit(sane(e.data),{local:true}); }; }catch(e){}
    window.addEventListener('storage',function(e){ if(e.key===CACHE&&e.newValue){ emit(sane(JSON.parse(e.newValue)),{local:true}); } });
    var c=cached(); emit(c||defaultState(),{local:true,first:true,exists:!!c});
  }
  function startFirebase(){
    if(typeof firebase==='undefined'){ setTimeout(startFirebase,300); return; }
    try{
      if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
      ref=firebase.firestore().collection('spartak').doc('tabule');
      ready=true;
      var first=true;
      ref.onSnapshot({includeMetadataChanges:true},function(snap){
        var meta={fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites,exists:snap.exists,first:first};
        first=false;
        if(snap.exists){ var s=sane(snap.data()); cache(s); emit(s,meta); }
        else { emit(cached()||defaultState(),meta); }
      },function(err){ console.error(err); emit(cached()||defaultState(),{error:String(err&&err.message||err),fromCache:true}); });
    }catch(e){ console.error(e); emit(cached()||defaultState(),{error:String(e),fromCache:true}); }
  }
  return {
    local:LOCAL,
    subscribe:function(f){ listeners.push(f); },
    start:function(){
      var c=cached(); if(c&&!LOCAL) emit(c,{fromCache:true,cachedOnly:true});
      if(LOCAL) startLocal(); else startFirebase();
    },
    write:function(state){
      cache(state);
      if(LOCAL){ try{ bc&&bc.postMessage(state); }catch(e){} return Promise.resolve(); }
      if(!ref) return Promise.reject(new Error('Firebase ještě není připojený'));
      return ref.set(state);
    }
  };
})();


var $=function(id){return document.getElementById(id);};
var state=defaultState();

function half(el,k,score,cls,used){
  var T=TEAMS[k];
  el.style.setProperty('--c',T.color);
  el.style.setProperty('--tint',k==='S'?'rgba(47,224,122,.13)':'rgba(51,181,244,.16)');
  el.innerHTML='<img class="logo" src="'+T.logo+'" alt=""><div class="tn">'+T.name+'</div><div class="sc '+(cls||'')+'">'+score+'</div><div class="tob '+(used?'used':'')+'">TIME-OUT · '+(used?'VYUŽIT':'VOLNÝ')+'</div>';
}
function other(k){return k==='S'?'M':'S';}
function render(s){
  state=s;
  var cur=s.cur, L=s.sides[cur], R=other(L), cs=s.sets[cur];
  var over=(cs.s>=SET_POINTS||cs.m>=SET_POINTS), win=over?(cs.s>=SET_POINTS?'S':'M'):null;
  $('top').textContent='SET '+(cur+1)+(over?' · KONEC SETU':'');
  var tu=(s.tou&&s.tou[cur])||{};
  half($('hl'),L,cs[L.toLowerCase()],over?(win===L?'win':'lose'):'',tu[L]);
  half($('hr'),R,cs[R.toLowerCase()],over?(win===R?'win':'lose'):'',tu[R]);

  var h='';
  for(var i=0;i<3;i++){
    var sl=s.sides[i], sr=other(sl), st=s.sets[i];
    var fin=(i<cur)||(i===cur&&over);
    var show=i<=cur, cls=fin?'done':(i===cur?'cur':'');
    var a=st[sl.toLowerCase()], b=st[sr.toLowerCase()];
    function num(v,o,k){ if(!show) return '<div class="n">–</div>';
      var c=fin?(v>o?'win':(v<o?'lose':'')):''; return '<div class="n '+c+'" style="--wc:'+TEAMS[k].color+'">'+v+'</div>'; }
    h+='<div class="srow '+cls+'"><div class="lbl">'+(i+1)+'. SET</div>'+
       '<div class="l"><img src="'+TEAMS[sl].logo+'" alt="">'+num(a,b,sl)+'</div>'+
       '<div class="x">:</div>'+
       '<div class="r">'+num(b,a,sr)+'<img src="'+TEAMS[sr].logo+'" alt=""></div></div>';
  }
  $('sets').innerHTML=h;

  $('match').innerHTML='<div class="mh">Celkové skóre zápasu</div><div class="mrow">'+
    '<div class="l"><img src="'+TEAMS[L].logo+'" alt=""><div class="n">'+s.match[L.toLowerCase()]+'</div></div>'+
    '<div class="x">:</div>'+
    '<div class="r"><div class="n">'+s.match[R.toLowerCase()]+'</div><img src="'+TEAMS[R].logo+'" alt=""></div></div>';
}

/* připojení: červená tečka v rohu jen když chybí spojení se serverem */
var netT=null;
function netOk(ok){
  clearTimeout(netT);
  if(ok){ $('net').classList.remove('on'); return; }
  netT=setTimeout(function(){ $('net').classList.add('on'); },8000);
}
/* TIME-OUT: odpočítává se tady na tabuli od chvíle, kdy zpráva dorazí (nezávisle na hodinách telefonu) */
var toLastId=null, toTimer=null, toEnd=0;
function toStop(){ clearInterval(toTimer); toTimer=null; $('to').classList.remove('on','warn'); }
function toTick(){
  var ms=toEnd-Date.now(), left=Math.max(0,Math.ceil(ms/1000));
  $('toN').textContent=left;
  $('toBar').style.width=Math.max(0,Math.min(100,ms/(TIMEOUT_SEC*10)))+'%';
  $('to').classList.toggle('warn',left<=5);
  if(ms<=-1000) toStop();
}
function toStart(team){
  var T=TEAMS[team], el=$('to');
  el.style.setProperty('--c',T.color);
  el.style.setProperty('--tint',team==='S'?'rgba(47,224,122,.16)':'rgba(51,181,244,.2)');
  $('toL').src=T.logo; $('toR').src=T.logo; $('toName').textContent=T.name;
  toEnd=Date.now()+TIMEOUT_SEC*1000;
  clearInterval(toTimer); el.classList.add('on'); toTick(); toTimer=setInterval(toTick,200);
}
function toHandle(s,meta){
  var id=s.timeout?s.timeout.id:null;
  if(meta.cachedOnly) return;
  if(meta.first){ toLastId=id; return; }        /* při načtení stránky starý time-out nespouštěj */
  if(id===toLastId) return;
  toLastId=id;
  if(id) toStart(s.timeout.team); else toStop(); /* null = admin time-out zrušil */
}
Store.subscribe(function(s,meta){
  render(s); toHandle(s,meta);
  if(!Store.local) netOk(!(meta.fromCache||meta.error));
});
render(defaultState());
Store.start();
if(!Store.local) netOk(false);

/* F = celá obrazovka, kurzor se po 2 s schová */
addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
  }
});
addEventListener('dblclick',function(){ if(!document.fullscreenElement&&document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); });
var idleT; function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(function(){document.body.classList.add('idle');},2000); }
addEventListener('mousemove',wake); wake();
if(navigator.wakeLock&&navigator.wakeLock.request){ var wl=function(){ navigator.wakeLock.request('screen').catch(function(){}); }; wl(); document.addEventListener('visibilitychange',function(){ if(!document.hidden) wl(); }); }
</script>
